services:
  research:
    image: crypto-research:latest
    build:
      context: .
      dockerfile: Dockerfile.research
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg
    entrypoint: ["python"]
    command: ["analyze_live.py", "--demo"]
